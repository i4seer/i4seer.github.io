<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<meta name="copyright" content="Institute for Seer LLC">
<title>Three-Knock</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0a07;color:#c8c0b0;font-family:-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
.glow{position:fixed;top:50%;left:50%;width:300px;height:300px;background:radial-gradient(circle,rgba(255,179,71,0.12) 0%,transparent 70%);transform:translate(-50%,-50%);pointer-events:none;z-index:0}
.container{max-width:380px;margin:0 auto;padding:1.2rem;position:relative;z-index:1}
h1{font-size:1.4rem;color:#ffb347;text-shadow:0 0 15px rgba(255,179,71,0.4);letter-spacing:3px;text-align:center;margin-bottom:0.2rem}
.sub{text-align:center;font-size:0.75rem;opacity:0.3;margin-bottom:1.5rem;letter-spacing:1px}
.card{background:#111;border:1px solid #2a1f14;border-radius:10px;padding:1rem;margin-bottom:1rem}
.card h2{font-size:0.85rem;color:#ffb347;text-transform:uppercase;letter-spacing:2px;margin-bottom:0.8rem}
label{display:block;font-size:0.8rem;color:#8a7a5a;margin-bottom:0.3rem;margin-top:0.7rem}
label:first-of-type{margin-top:0}
input[type="range"]{width:100%;accent-color:#ffb347;background:transparent;height:6px;-webkit-appearance:none;appearance:none;border-radius:3px;outline:none}
input[type="range"]::-webkit-slider-runnable-track{background:#2a1f14;height:6px;border-radius:3px}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#ffb347;cursor:pointer;margin-top:-6px;box-shadow:0 0 8px rgba(255,179,71,0.5)}
.val{float:right;color:#ffb347;font-size:0.8rem;font-family:monospace}
select{width:100%;background:#0d0a07;color:#c8c0b0;border:1px solid #2a1f14;border-radius:6px;padding:0.5rem;font-size:0.9rem;outline:none}
select:focus{border-color:#ffb347}
.time-row{display:flex;gap:0.8rem}
.time-row div{flex:1;text-align:center}
.time-row input{width:100%;background:#0d0a07;color:#c8c0b0;border:1px solid #2a1f14;border-radius:6px;padding:0.4rem;font-size:0.9rem;text-align:center;outline:none}
.time-row input:focus{border-color:#ffb347}
.time-colon{display:flex;align-items:center;color:#ffb347;font-size:1.2rem;padding-top:1.2rem}
.btn{display:block;width:100%;padding:0.8rem;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;letter-spacing:1px;margin-top:0.5rem}
.btn-save{background:#ffb347;color:#0d0a07;box-shadow:0 0 20px rgba(255,179,71,0.3)}
.btn-save:active{box-shadow:0 0 30px rgba(255,179,71,0.6)}
.btn-test{background:transparent;border:1px solid #ffb347;color:#ffb347;margin-top:0.5rem}
.btn-test:active{background:rgba(255,179,71,0.1)}
.btn-upload{background:transparent;border:1px solid #ffb347;color:#ffb347}
.btn-upload:active{background:rgba(255,179,71,0.1)}
.status{text-align:center;font-size:0.75rem;opacity:0.4;margin-top:1rem}
.file-info{font-size:0.75rem;opacity:0.4;margin-top:0.3rem}
input[type="file"]{display:none}
.wifi-section{margin-top:0.3rem}
.wifi-section input[type="text"],.wifi-section input[type="password"]{width:100%;background:#0d0a07;color:#c8c0b0;border:1px solid #2a1f14;border-radius:6px;padding:0.5rem;font-size:0.9rem;outline:none;margin-top:0.2rem}
.wifi-section input:focus{border-color:#ffb347}
.opt{font-size:0.7rem;opacity:0.3;text-align:center;margin-bottom:0.5rem}
.knock-vis{display:flex;justify-content:center;gap:0.8rem;margin:0.8rem 0}
.knock-dot{width:12px;height:12px;border-radius:50%;background:#2a1f14;transition:background 0.15s,box-shadow 0.15s}
.knock-dot.active{background:#ffb347;box-shadow:0 0 10px rgba(255,179,71,0.6)}
.quote{text-align:center;font-style:italic;font-size:0.8rem;opacity:0.25;margin-top:1.5rem;line-height:1.5}
</style>
</head>
<body>
<div class="glow"></div>
<div class="container">

  <h1>THREE-KNOCK</h1>
  <p class="sub">Tick &middot; ATOM Matrix + Echo Base</p>

  <!-- AUDIO -->
  <div class="card">
    <h2>Audio</h2>
    <input type="file" id="fileInput" accept=".wav">
    <button class="btn btn-upload" onclick="document.getElementById('fileInput').click()">Upload Knock Sound</button>
    <p class="file-info" id="fileInfo">No file selected. WAV, 16-bit, mono.</p>

    <label>Volume <span class="val" id="volv">75</span>%</label>
    <input type="range" id="volume" min="0" max="100" value="75" oninput="document.getElementById('volv').textContent=this.value">

    <div class="knock-vis">
      <div class="knock-dot" id="k1"></div>
      <div class="knock-dot" id="k2"></div>
      <div class="knock-dot" id="k3"></div>
    </div>

    <button class="btn btn-test" onclick="testPlay()">Play Now</button>
  </div>

  <!-- SCHEDULE -->
  <div class="card">
    <h2>Schedule</h2>
    <div class="time-row">
      <div>
        <label>Hour</label>
        <input type="text" id="schedH" value="3" maxlength="2">
      </div>
      <div class="time-colon">:</div>
      <div>
        <label>Minute</label>
        <input type="text" id="schedM" value="07" maxlength="2">
      </div>
    </div>
    <label>Repeat</label>
    <select id="repeat">
      <option value="1" selected>Every night</option>
      <option value="0">Off</option>
    </select>
  </div>

  <!-- WI-FI (OPTIONAL) -->
  <div class="card">
    <h2>Wi-Fi</h2>
    <p class="opt">optional &mdash; enables NTP time sync</p>
    <div class="wifi-section">
      <label>Network name</label>
      <input type="text" id="ssid" placeholder="your-wifi" autocomplete="off">
      <label>Password</label>
      <input type="password" id="pass" placeholder="password" autocomplete="off">
    </div>
  </div>

  <!-- SAVE -->
  <button class="btn btn-save" onclick="save()">Save &amp; Reboot</button>

  <p class="status" id="status">192.168.4.1</p>

  <p class="quote">"Three knocks. Every night. 3:07 AM.<br>The counselors say raccoons.<br>The counselors are wrong."</p>

</div>

<script>
document.getElementById('fileInput').addEventListener('change',function(){
  if(this.files.length>0){
    var f=this.files[0];
    document.getElementById('fileInfo').textContent=f.name+' ('+Math.round(f.size/1024)+'KB)';
  }
});

function knockAnim(){
  var dots=['k1','k2','k3'];
  dots.forEach(function(id,i){
    setTimeout(function(){
      var el=document.getElementById(id);
      el.classList.add('active');
      setTimeout(function(){el.classList.remove('active')},300);
    },i*1500);
  });
}

function testPlay(){
  knockAnim();
  fetch('/play',{method:'POST'}).then(function(){
    document.getElementById('status').textContent='Playing...';
    setTimeout(function(){document.getElementById('status').textContent='192.168.4.1'},3000);
  }).catch(function(){
    document.getElementById('status').textContent='No response.';
  });
}

function save(){
  var fd=new FormData();
  fd.append('volume',document.getElementById('volume').value);
  fd.append('schedH',document.getElementById('schedH').value);
  fd.append('schedM',document.getElementById('schedM').value);
  fd.append('repeat',document.getElementById('repeat').value);
  fd.append('ssid',document.getElementById('ssid').value);
  fd.append('pass',document.getElementById('pass').value);
  var fileInput=document.getElementById('fileInput');
  if(fileInput.files.length>0){
    fd.append('audio',fileInput.files[0]);
  }
  fetch('/save',{method:'POST',body:fd}).then(function(){
    document.getElementById('status').textContent='Saved. Rebooting...';
  }).catch(function(){
    document.getElementById('status').textContent='Saved. Rebooting...';
  });
}
</script>
</body>
</html>
