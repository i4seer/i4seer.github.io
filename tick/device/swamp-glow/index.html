<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<meta name="copyright" content="Institute for Seer LLC">
<title>Swamp Glow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0d0a;color:#c0c8b8;font-family:-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
.glow{position:fixed;top:50%;left:50%;width:300px;height:300px;background:radial-gradient(circle,rgba(5,40,3,0.3) 0%,transparent 70%);transform:translate(-50%,-50%);pointer-events:none;z-index:0}
.container{max-width:380px;margin:0 auto;padding:1.2rem;position:relative;z-index:1}
h1{font-size:1.4rem;color:#39ff14;text-shadow:0 0 15px rgba(57,255,20,0.4);letter-spacing:3px;text-align:center;margin-bottom:0.2rem}
.sub{text-align:center;font-size:0.75rem;opacity:0.3;margin-bottom:1.5rem;letter-spacing:1px}
.card{background:#111;border:1px solid #1a2a1a;border-radius:10px;padding:1rem;margin-bottom:1rem}
.card h2{font-size:0.85rem;color:#39ff14;text-transform:uppercase;letter-spacing:2px;margin-bottom:0.8rem}
label{display:block;font-size:0.8rem;color:#6a8a6a;margin-bottom:0.3rem;margin-top:0.7rem}
label:first-of-type{margin-top:0}
input[type="range"]{width:100%;accent-color:#39ff14;background:transparent;height:6px;-webkit-appearance:none;appearance:none;border-radius:3px;outline:none}
input[type="range"]::-webkit-slider-runnable-track{background:#1a2a1a;height:6px;border-radius:3px}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#39ff14;cursor:pointer;margin-top:-6px;box-shadow:0 0 8px rgba(57,255,20,0.5)}
.val{float:right;color:#39ff14;font-size:0.8rem;font-family:monospace}
.color-row{display:flex;gap:0.5rem;margin-top:0.5rem}
.color-row div{flex:1}
.color-row input{width:100%}
.swatch{width:40px;height:40px;border-radius:8px;border:2px solid #1a2a1a;margin:0.5rem auto;display:block}
select{width:100%;background:#0a0d0a;color:#c0c8b8;border:1px solid #1a2a1a;border-radius:6px;padding:0.5rem;font-size:0.9rem;outline:none}
select:focus{border-color:#39ff14}
.time-row{display:flex;gap:0.8rem}
.time-row div{flex:1}
.time-row input{width:100%;background:#0a0d0a;color:#c0c8b8;border:1px solid #1a2a1a;border-radius:6px;padding:0.4rem;font-size:0.9rem;text-align:center;outline:none}
.time-row input:focus{border-color:#39ff14}
.btn{display:block;width:100%;padding:0.8rem;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;letter-spacing:1px;margin-top:0.5rem}
.btn-save{background:#39ff14;color:#0a0d0a;box-shadow:0 0 20px rgba(57,255,20,0.3)}
.btn-save:active{box-shadow:0 0 30px rgba(57,255,20,0.6)}
.btn-test{background:transparent;border:1px solid #39ff14;color:#39ff14;margin-top:0.5rem}
.btn-test:active{background:rgba(57,255,20,0.1)}
.status{text-align:center;font-size:0.75rem;opacity:0.4;margin-top:1rem}
.divider{border:none;border-top:1px solid #1a2a1a;margin:0.8rem 0}
.wifi-section{margin-top:0.3rem}
.wifi-section input[type="text"],.wifi-section input[type="password"]{width:100%;background:#0a0d0a;color:#c0c8b8;border:1px solid #1a2a1a;border-radius:6px;padding:0.5rem;font-size:0.9rem;outline:none;margin-top:0.2rem}
.wifi-section input:focus{border-color:#39ff14}
.opt{font-size:0.7rem;opacity:0.3;text-align:center;margin-bottom:0.5rem}
.quote{text-align:center;font-style:italic;font-size:0.8rem;opacity:0.25;margin-top:1.5rem;line-height:1.5}
</style>
</head>
<body>
<div class="glow"></div>
<div class="container">

  <h1>SWAMP GLOW</h1>
  <p class="sub">Tick &middot; ATOM Matrix</p>

  <!-- LED SETTINGS -->
  <div class="card">
    <h2>LED</h2>
    <div style="text-align:center"><div class="swatch" id="swatch"></div></div>
    <div class="color-row">
      <div>
        <label>R <span class="val" id="rv">5</span></label>
        <input type="range" id="r" min="0" max="255" value="5" oninput="upd()">
      </div>
      <div>
        <label>G <span class="val" id="gv">40</span></label>
        <input type="range" id="g" min="0" max="255" value="40" oninput="upd()">
      </div>
      <div>
        <label>B <span class="val" id="bv">3</span></label>
        <input type="range" id="b" min="0" max="255" value="3" oninput="upd()">
      </div>
    </div>

    <label>Brightness <span class="val" id="brv">20</span></label>
    <input type="range" id="bright" min="1" max="80" value="20" oninput="document.getElementById('brv').textContent=this.value">

    <label>Pattern</label>
    <select id="pattern">
      <option value="0">Solid</option>
      <option value="1">Pulse</option>
      <option value="2">Flicker</option>
      <option value="3" selected>Breathe</option>
    </select>

    <button class="btn btn-test" onclick="testLed()">Test</button>
  </div>

  <!-- TIMING -->
  <div class="card">
    <h2>Timing</h2>
    <div class="time-row">
      <div>
        <label>On (min)</label>
        <input type="text" id="onMin" value="120">
      </div>
      <div>
        <label>Off (min)</label>
        <input type="text" id="offMin" value="10">
      </div>
    </div>
  </div>

  <!-- WI-FI (OPTIONAL) -->
  <div class="card">
    <h2>Wi-Fi</h2>
    <p class="opt">optional &mdash; leave blank to skip</p>
    <div class="wifi-section">
      <label>Network name</label>
      <input type="text" id="ssid" placeholder="your-wifi" autocomplete="off">
      <label>Password</label>
      <input type="password" id="pass" placeholder="password" autocomplete="off">
    </div>
  </div>

  <!-- SAVE -->
  <button class="btn btn-save" onclick="save()">Save &amp; Reboot</button>

  <p class="status" id="status">192.168.4.1</p>

  <p class="quote">"Two hours on. Ten minutes dark.<br>She built them to keep something away.<br>Nobody remembers what."</p>

</div>

<script>
function upd(){
  var r=document.getElementById('r').value,
      g=document.getElementById('g').value,
      b=document.getElementById('b').value;
  document.getElementById('rv').textContent=r;
  document.getElementById('gv').textContent=g;
  document.getElementById('bv').textContent=b;
  document.getElementById('swatch').style.background='rgb('+r+','+g+','+b+')';
  document.getElementById('swatch').style.boxShadow='0 0 15px rgba('+r+','+g+','+b+',0.5)';
}
upd();

function testLed(){
  var fd=new FormData();
  fd.append('r',document.getElementById('r').value);
  fd.append('g',document.getElementById('g').value);
  fd.append('b',document.getElementById('b').value);
  fd.append('bright',document.getElementById('bright').value);
  fd.append('pattern',document.getElementById('pattern').value);
  fetch('/test',{method:'POST',body:fd}).then(function(){
    document.getElementById('status').textContent='Sent.';
  }).catch(function(){
    document.getElementById('status').textContent='No response.';
  });
}

function save(){
  var fd=new FormData();
  fd.append('r',document.getElementById('r').value);
  fd.append('g',document.getElementById('g').value);
  fd.append('b',document.getElementById('b').value);
  fd.append('bright',document.getElementById('bright').value);
  fd.append('pattern',document.getElementById('pattern').value);
  fd.append('onMin',document.getElementById('onMin').value);
  fd.append('offMin',document.getElementById('offMin').value);
  fd.append('ssid',document.getElementById('ssid').value);
  fd.append('pass',document.getElementById('pass').value);
  fetch('/save',{method:'POST',body:fd}).then(function(){
    document.getElementById('status').textContent='Saved. Rebooting...';
  }).catch(function(){
    document.getElementById('status').textContent='Saved. Rebooting...';
  });
}
</script>
</body>
</html>
