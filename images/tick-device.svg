<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <!-- Light enclosure gradient -->
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafa"/>
      <stop offset="15%" style="stop-color:#eef5f4"/>
      <stop offset="50%" style="stop-color:#e4efee"/>
      <stop offset="85%" style="stop-color:#eef5f4"/>
      <stop offset="100%" style="stop-color:#f0f7f6"/>
    </linearGradient>
    <!-- Teal accent gradient -->
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a7a6d"/>
      <stop offset="100%" style="stop-color:#2eb8a3"/>
    </linearGradient>
    <!-- USB-C port gradient -->
    <linearGradient id="usbGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b0c4c1"/>
      <stop offset="50%" style="stop-color:#8aa8a3"/>
      <stop offset="100%" style="stop-color:#9ab5b1"/>
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1a2e2a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Main Case Body -->
  <g filter="url(#shadow)">
    <!-- Case outline with rounded corners -->
    <rect x="60" y="60" width="280" height="160" rx="12" ry="12" fill="url(#metalGradient)" stroke="#c0d8d5" stroke-width="1.5"/>

    <!-- Top edge highlight -->
    <rect x="62" y="62" width="276" height="2" rx="1" fill="#ffffff" opacity="0.6"/>

    <!-- Case texture lines -->
    <line x1="70" y1="80" x2="330" y2="80" stroke="#d0e4e1" stroke-width="0.5"/>
    <line x1="70" y1="200" x2="330" y2="200" stroke="#d0e4e1" stroke-width="0.5"/>
  </g>

  <!-- Teal Check Mark Badge -->
  <g transform="translate(270, 85)">
    <path d="M10 32 L24 46 L52 18" fill="none" stroke="url(#tealGlow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- i4Seer Logo Text -->
  <text x="90" y="115" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a7a6d">Tick</text>
  <text x="90" y="138" font-family="Arial, sans-serif" font-size="12" fill="#7a9a94">by i4Seer</text>

  <!-- I2C Connector (left side) -->
  <g transform="translate(60, 150)">
    <!-- Connector housing -->
    <rect x="-8" y="0" width="12" height="40" rx="2" fill="#c0d8d5" stroke="#a0bab7" stroke-width="1"/>
    <!-- Pin holes -->
    <circle cx="-2" cy="8" r="2" fill="#8aa8a3"/>
    <circle cx="-2" cy="16" r="2" fill="#8aa8a3"/>
    <circle cx="-2" cy="24" r="2" fill="#8aa8a3"/>
    <circle cx="-2" cy="32" r="2" fill="#8aa8a3"/>
    <!-- Label -->
    <text x="15" y="24" font-family="monospace" font-size="8" fill="#7a9a94">I2C</text>
  </g>

  <!-- USB-C Port (right side) -->
  <g transform="translate(340, 125)">
    <!-- USB-C housing -->
    <rect x="0" y="0" width="16" height="30" rx="3" fill="url(#usbGradient)" stroke="#a0bab7" stroke-width="1"/>
    <!-- USB-C port opening -->
    <rect x="3" y="8" width="10" height="14" rx="4" fill="#d0e4e1"/>
    <!-- Inner detail -->
    <rect x="5" y="11" width="6" height="8" rx="2" fill="#b8d4d0"/>
    <!-- Label -->
    <text x="-25" y="20" font-family="monospace" font-size="8" fill="#7a9a94">USB-C</text>
  </g>

  <!-- Status LED -->
  <circle cx="100" cy="185" r="4" fill="#1a7a6d" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="110" y="188" font-family="monospace" font-size="8" fill="#7a9a94">STATUS</text>

  <!-- Cellular indicator icon -->
  <g transform="translate(195, 160)">
    <rect x="0" y="12" width="4" height="6" rx="1" fill="#2eb8a3" opacity="0.5"/>
    <rect x="6" y="8" width="4" height="10" rx="1" fill="#2eb8a3" opacity="0.65"/>
    <rect x="12" y="4" width="4" height="14" rx="1" fill="#2eb8a3" opacity="0.8"/>
    <rect x="18" y="0" width="4" height="18" rx="1" fill="#1a7a6d" opacity="0.95"/>
  </g>
  <text x="207" y="195" font-family="monospace" font-size="8" fill="#7a9a94" text-anchor="middle">Cellular</text>

  <!-- Ventilation slots -->
  <g transform="translate(130, 170)">
    <rect x="0" y="0" width="20" height="2" rx="1" fill="#d0e4e1"/>
    <rect x="0" y="5" width="20" height="2" rx="1" fill="#d0e4e1"/>
    <rect x="0" y="10" width="20" height="2" rx="1" fill="#d0e4e1"/>
  </g>

  <!-- Mounting holes -->
  <circle cx="75" cy="75" r="4" fill="#e0eeec" stroke="#c0d8d5" stroke-width="1"/>
  <circle cx="325" cy="75" r="4" fill="#e0eeec" stroke="#c0d8d5" stroke-width="1"/>
  <circle cx="75" cy="205" r="4" fill="#e0eeec" stroke="#c0d8d5" stroke-width="1"/>
  <circle cx="325" cy="205" r="4" fill="#e0eeec" stroke="#c0d8d5" stroke-width="1"/>

  <!-- Size reference line -->
  <g transform="translate(60, 240)">
    <line x1="0" y1="0" x2="280" y2="0" stroke="#b0c4c1" stroke-width="1"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#b0c4c1" stroke-width="1"/>
    <line x1="280" y1="-5" x2="280" y2="5" stroke="#b0c4c1" stroke-width="1"/>
    <text x="120" y="15" font-family="Arial, sans-serif" font-size="10" fill="#7a9a94">76mm x 38mm</text>
  </g>
</svg>
