<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <!-- Metal gradient for case -->
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3a"/>
      <stop offset="15%" style="stop-color:#2a2a2a"/>
      <stop offset="50%" style="stop-color:#1a1a1a"/>
      <stop offset="85%" style="stop-color:#2a2a2a"/>
      <stop offset="100%" style="stop-color:#1e1e1e"/>
    </linearGradient>
    <!-- Blue accent gradient -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#29b6f6"/>
    </linearGradient>
    <!-- USB-C port gradient -->
    <linearGradient id="usbGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#555"/>
      <stop offset="50%" style="stop-color:#333"/>
      <stop offset="100%" style="stop-color:#444"/>
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <!-- Inner shadow -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="1"/>
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Main Case Body -->
  <g filter="url(#shadow)">
    <!-- Case outline with rounded corners -->
    <rect x="60" y="60" width="280" height="160" rx="12" ry="12" fill="url(#metalGradient)" stroke="#444" stroke-width="1"/>

    <!-- Top edge highlight -->
    <rect x="62" y="62" width="276" height="2" rx="1" fill="#4a4a4a" opacity="0.6"/>

    <!-- Case texture lines -->
    <line x1="70" y1="80" x2="330" y2="80" stroke="#333" stroke-width="0.5"/>
    <line x1="70" y1="200" x2="330" y2="200" stroke="#333" stroke-width="0.5"/>
  </g>

  <!-- Blue Check Mark Badge -->
  <g transform="translate(270, 85)">
    <!-- Check mark only - no circle background -->
    <path d="M10 32 L24 46 L52 18" fill="none" stroke="url(#blueGlow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- i4Seer Logo Text -->
  <text x="90" y="115" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#4fc3f7">Tick</text>
  <text x="90" y="138" font-family="Arial, sans-serif" font-size="12" fill="#888">by i4Seer</text>

  <!-- I2C Connector (left side) -->
  <g transform="translate(60, 150)">
    <!-- Connector housing -->
    <rect x="-8" y="0" width="12" height="40" rx="2" fill="#333" stroke="#444" stroke-width="1"/>
    <!-- Pin holes -->
    <circle cx="-2" cy="8" r="2" fill="#222"/>
    <circle cx="-2" cy="16" r="2" fill="#222"/>
    <circle cx="-2" cy="24" r="2" fill="#222"/>
    <circle cx="-2" cy="32" r="2" fill="#222"/>
    <!-- Label -->
    <text x="15" y="24" font-family="monospace" font-size="8" fill="#666">I2C</text>
  </g>

  <!-- USB-C Port (right side) -->
  <g transform="translate(340, 125)">
    <!-- USB-C housing -->
    <rect x="0" y="0" width="16" height="30" rx="3" fill="url(#usbGradient)" stroke="#555" stroke-width="1"/>
    <!-- USB-C port opening -->
    <rect x="3" y="8" width="10" height="14" rx="4" fill="#111"/>
    <!-- Inner detail -->
    <rect x="5" y="11" width="6" height="8" rx="2" fill="#222"/>
    <!-- Label -->
    <text x="-25" y="20" font-family="monospace" font-size="8" fill="#666">USB-C</text>
  </g>

  <!-- Status LED -->
  <circle cx="100" cy="185" r="4" fill="#4fc3f7" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="110" y="188" font-family="monospace" font-size="8" fill="#666">STATUS</text>

  <!-- WiFi indicator icon -->
  <g transform="translate(200, 165)">
    <path d="M0 12 Q10 0 20 12" fill="none" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M3 9 Q10 2 17 9" fill="none" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M6 6 Q10 3 14 6" fill="none" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <circle cx="10" cy="14" r="2" fill="#4fc3f7"/>
  </g>
  <text x="210" y="195" font-family="monospace" font-size="8" fill="#666" text-anchor="middle">Wireless</text>

  <!-- Ventilation slots -->
  <g transform="translate(130, 170)">
    <rect x="0" y="0" width="20" height="2" rx="1" fill="#222"/>
    <rect x="0" y="5" width="20" height="2" rx="1" fill="#222"/>
    <rect x="0" y="10" width="20" height="2" rx="1" fill="#222"/>
  </g>

  <!-- Mounting holes -->
  <circle cx="75" cy="75" r="4" fill="#111" stroke="#333" stroke-width="1"/>
  <circle cx="325" cy="75" r="4" fill="#111" stroke="#333" stroke-width="1"/>
  <circle cx="75" cy="205" r="4" fill="#111" stroke="#333" stroke-width="1"/>
  <circle cx="325" cy="205" r="4" fill="#111" stroke="#333" stroke-width="1"/>

  <!-- Size reference line -->
  <g transform="translate(60, 240)">
    <line x1="0" y1="0" x2="280" y2="0" stroke="#444" stroke-width="1"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#444" stroke-width="1"/>
    <line x1="280" y1="-5" x2="280" y2="5" stroke="#444" stroke-width="1"/>
    <text x="120" y="15" font-family="Arial, sans-serif" font-size="10" fill="#666">65mm × 38mm</text>
  </g>
</svg>
