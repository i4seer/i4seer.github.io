<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - i4Seer">
    <title>404 - Page Not Found | i4Seer</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="logo">
                <svg class="logo-icon" viewBox="0 0 32 32" fill="none">
                    <path d="M4 16 L12 24 L28 8" stroke="#4fc3f7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg><span class="logo-text">i4<span class="logo-accent">Seer</span></span></a>
            <nav class="nav" id="nav-menu">
                <a href="/">Home</a>
                <a href="/pages/product/">Product</a>
                <a href="/pages/features/">Features</a>
                <a href="/pages/quickstart/">Quick Start</a>
                <a href="/#contact" class="nav-cta">Contact</a>
            </nav>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <section class="hero" style="min-height: 60vh;">
        <div class="container" style="text-align: center;">
            <h1>404</h1>
            <p class="hero-tagline">The page you're looking for doesn't exist or has been moved.</p>
            <div class="hero-cta">
                <a href="/" class="btn btn-primary">Back to Home</a>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <a href="/" class="logo">
                        <svg class="logo-icon" viewBox="0 0 32 32" fill="none">
                            <path d="M4 16 L12 24 L28 8" stroke="#4fc3f7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg><span class="logo-text">i4<span class="logo-accent">Seer</span></span></a>
                    <p>Seer means to foresee. IoT systems that predict, monitor, and optimize.</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 i4Seer. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        (function() {
            // Mobile nav toggle
            var navToggle = document.getElementById('nav-toggle');
            var navMenu = document.getElementById('nav-menu');
            if (navToggle && navMenu) {
                navToggle.onclick = function() {
                    navToggle.classList.toggle('active');
                    navMenu.classList.toggle('open');
                };
                navMenu.querySelectorAll('a').forEach(function(link) {
                    link.onclick = function() {
                        navToggle.classList.remove('active');
                        navMenu.classList.remove('open');
                    };
                });
            }
        })();
    </script>
</body>
</html>
